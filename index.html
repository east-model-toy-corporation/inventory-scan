<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10352f">
  <title>條碼盤點</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css">
  <script defer src="./vendor/zxing-library.min.js"></script>
  <script defer src="./vendor/xlsx.full.min.js"></script>
  <script defer src="./js/core.js"></script>
  <script defer src="./js/storage.js"></script>
  <script defer src="./js/api.js"></script>
  <script defer src="./js/scanner.js"></script>
  <script defer src="./js/app.js"></script>
</head>
<body>
  <div class="app-chrome">
    <header class="app-header">
      <div class="wrap">
        <div class="heading"><h1>條碼盤點</h1><span id="queue" class="badge" role="status"></span></div>
        <div class="session-bar"><span id="identity">尚未開始盤點</span><button id="zone-chip" type="button" aria-haspopup="dialog" aria-controls="zone-dialog" hidden></button><button id="end-session" type="button" hidden>結束盤點</button><button id="switch" type="button" hidden>切換</button></div>
        <button id="rejected-backup" type="button" hidden>匯出本機備份</button><small id="sync-status"></small>
      </div>
    </header>
    <nav class="tabs" aria-label="頁面">
      <div class="wrap">
        <button data-view="start" aria-current="page">設定開始</button>
        <button data-view="scan">刷讀</button>
        <button data-view="summary">彙總</button>
        <button data-view="settings">設定</button>
      </div>
    </nav>
  </div>
  <main class="wrap">
    <section id="start">
      <h2>設定開始</h2>
      <form id="start-form" class="stack">
        <fieldset class="panel stack">
          <legend>盤點位置</legend>
          <label>門市<select id="store" required></select></label>
          <div id="custom-entry" class="actions" hidden>
            <label>自訂門市<input id="custom-name" maxlength="60"></label>
            <button id="add-store" type="button">新增門市</button>
          </div>
          <div class="fields">
            <label>盤點人<input id="counter" required maxlength="100" autocomplete="name"></label>
            <label>區域／貨架（選填）<input id="zone" maxlength="100" list="recent-zones" autocomplete="off"></label>
            <datalist id="recent-zones"></datalist>
          </div>
        </fieldset>
        <fieldset class="panel stack">
          <legend>盤點場次</legend>
          <small id="session-info" role="status"></small>
        </fieldset>
        <fieldset class="panel stack">
          <legend>模式</legend>
          <label class="choice"><input type="radio" name="mode" value="master">有商品主檔（對照帳面）</label>
          <label class="choice"><input type="radio" name="mode" value="none" checked>無主檔（直接累計）</label>
          <div id="master-controls" class="stack" hidden>
            <button id="load-master" type="button">從雲端試算表載入</button>
            <label>匯入 Excel／CSV<input type="file" id="master-file" accept=".xlsx,.xls,.csv"></label>
            <small id="master-count" role="status"></small>
          </div>
        </fieldset>
        <button id="begin" class="primary" type="submit">開始盤點</button>
      </form>
    </section>
    <section id="scan" hidden>
      <h2>刷讀</h2>
      <div class="panel stack" id="camera-panel">
        <div id="camera-preview" class="camera-preview" hidden>
          <div id="preview" hidden><video id="video" playsinline muted autoplay></video><div class="guide"></div></div>
          <div id="scan-paused" role="status" hidden>⏸ 辨識暫停中・改完按「確定，繼續掃描」</div>
        </div>
        <div class="actions camera-actions">
          <button id="camera">開啟鏡頭</button>
          <button id="flip">切換前後鏡頭</button>
          <button id="torch" aria-pressed="false" hidden>手電筒</button>
        </div>
        <small id="camera-note" role="status"></small>
        <small id="ios-note" hidden>請用 Safari 開啟。若從 LINE 內建瀏覽器開啟，請改用 Safari。</small>
      </div>
      <div id="scan-placeholder" class="panel last" hidden>對準條碼開始掃描</div>
      <div id="last-scan" class="panel last" hidden>
        <div id="last-details" aria-live="polite"></div>
        <div id="last-controls">
          <div class="last-qty">
            <button type="button" data-adjust="-1" aria-label="減少一件">−</button>
            <input id="last-qty" inputmode="numeric" autocomplete="off" aria-label="最近刷讀總數">
            <button type="button" data-adjust="1" aria-label="增加一件">＋</button>
          </div>
          <div class="quick-qty">
            <button type="button" data-adjust="5">+5</button>
            <button type="button" data-adjust="10">+10</button>
            <button type="button" data-adjust="12">+12</button>
          </div>
          <button id="confirm-qty" type="button" class="primary" hidden>確定，繼續掃描</button>
        </div>
      </div>
      <div class="panel stack" id="manual-panel">
        <button id="manual-toggle" type="button" aria-controls="scan-form" aria-expanded="false">⌨ 手動輸入</button>
        <form id="scan-form" class="manual">
          <label>條碼<input id="barcode" type="text" inputmode="numeric" maxlength="64" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
          <label>數量<input id="qty" type="number" inputmode="numeric" min="1" max="999999" step="1" value="1" required></label>
          <button type="submit" class="primary">加入</button>
        </form>
        <small id="scan-note" role="status"></small>
      </div>

      <div class="panel stack">
        <div class="heading"><h3>刷讀明細</h3><small id="scan-totals"></small></div>
        <label>搜尋條碼或品名<input id="filter-lines" type="search"></label>
        <ul class="lines" id="lines"></ul>
      </div>
    </section>
    <section id="summary" hidden>
      <div class="heading"><h2>彙總</h2><button id="refresh">重新整理</button></div>
      <p id="summary-session"></p>
      <div id="session-master-actions" hidden>
        <button id="reload-master" type="button">重新載入場次主檔</button>
        <button id="send-master" type="button">重新上傳主檔到此場次</button>
      </div>
      <p id="summary-source" role="status"></p>
      <div id="summary-totals" class="panel metrics"></div>
      <div class="panel stack">
        <div class="actions">
          <button id="export-xlsx">匯出 Excel</button>
          <button id="export-csv">匯出 CSV</button>
        </div>
        <label>篩選結果<select id="filter-summary">
          <option value="all">全部</option><option value="diff">有差異</option>
          <option>主檔查無</option><option>未盤</option>
        </select></label>
        <div id="item-table"></div>
      </div>
      <div id="summary-groups"></div>
    </section>
    <section id="settings" hidden>
      <h2>設定</h2>
      <div class="panel stack">
        <h3>雲端連線</h3>
        <label>GAS API 網址<input id="url" type="url" inputmode="url" placeholder="https://…/exec" autocomplete="off"></label>
        <label>API 金鑰<input id="key" type="password" autocomplete="off"></label>
        <button id="ping">測試連線</button>
        <small id="ping-result" role="status"></small>
      </div>
      <div class="panel stack">
        <h3>裝置與刷讀</h3>
        <label>裝置名稱<input id="device-name" maxlength="100"></label>
        <label>防重複間隔（毫秒）<input id="dedupe" type="number" min="0" step="1" inputmode="numeric"></label>
        <label class="choice"><input id="beep" type="checkbox">嗶聲</label>
        <label class="choice"><input id="vibrate" type="checkbox">震動</label>
      </div>
      <div class="panel stack">
        <h3>自訂門市管理</h3>
        <ul id="custom-stores" class="lines"></ul>
      </div>
      <div class="panel stack">
        <h3>本機資料</h3>
        <button id="backup">匯出本機備份（JSON）</button>
        <button id="clear-lines" class="danger">清除本機已上傳資料</button>
      </div>
    </section>
  </main>
  <div id="toast" role="status" hidden></div>
  <div id="zone-overlay" hidden>
    <div id="zone-dialog" role="dialog" aria-modal="true" aria-labelledby="zone-title" class="stack">
      <h3 id="zone-title">變更區域</h3>
      <form id="zone-form" class="stack">
        <label>區域／貨架（選填）<input id="scan-zone" maxlength="100" list="recent-zones" autocomplete="off"></label>
        <div class="actions">
          <button class="primary" type="submit">確定</button>
          <button id="clear-zone" type="button">清除</button>
          <button id="cancel-zone" type="button">取消</button>
        </div>
      </form>
    </div>
  </div>
  <div id="unknown-overlay" hidden>
    <section id="unknown-dialog" role="dialog" aria-modal="true" aria-labelledby="unknown-title">
      <h2 id="unknown-title">主檔查無此商品</h2>
      <p id="unknown-scan"></p>
      <div id="unknown-choices" class="stack">
        <button id="search-master" type="button">用品名搜尋</button>
        <button id="count-unknown" type="button" class="primary">直接計入</button>
        <button id="cancel-unknown" type="button">取消（不計入）</button>
      </div>
      <div id="unknown-search" class="stack" hidden>
        <button id="back-to-choices" type="button">← 返回</button>
        <label>搜尋品名、條碼或貨號<input id="master-query" type="search" autocomplete="off"></label>
        <div id="master-results" class="stack" aria-live="polite"></div>
        <button id="cancel-search" type="button">取消</button>
      </div>
    </section>
  </div>
</body>
</html>
